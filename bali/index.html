<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Wo stehst du?</title>
<style>
:root{
  --bg:#f4f6f9; --karte:#ffffff; --text:#1b2430; --gedaempft:#5b6779;
  --akzent:#1f4e79; --rand:#d9dfe7; --ok:#1e7f4f; --warn:#8a6d1f;
  --ja:#1f5f99; --bed:#6b4f9a; --nein:#2b7a73;
  --radius:16px; --tap:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
     background:var(--bg);color:var(--text);font-size:17px;line-height:1.45}
.huelle{max-width:560px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:1.45rem;margin:.1em 0 .2em}
.unter{color:var(--gedaempft);margin:0 0 14px;font-size:.95rem}
.karte{background:var(--karte);border:1px solid var(--rand);border-radius:var(--radius);
       padding:16px;margin-bottom:14px}
.antrag{font-size:.98rem}
.antrag b{display:block;margin-bottom:4px}
.frage{font-size:1.2rem;font-weight:700;margin:4px 0 12px}
.wahl{display:grid;gap:12px}
button{font:inherit;cursor:pointer}
.knopf{min-height:var(--tap);width:100%;border-radius:14px;border:3px solid transparent;
       color:#fff;font-weight:700;font-size:1.15rem;padding:14px 16px;text-align:left;
       display:flex;align-items:center;justify-content:space-between;gap:10px}
.knopf[data-w=ja]{background:var(--ja)}
.knopf[data-w=bed]{background:var(--bed)}
.knopf[data-w=nein]{background:var(--nein)}
.knopf .haken{font-size:1.3rem;visibility:hidden}
.knopf.gewaehlt{border-color:#111;box-shadow:0 0 0 3px #fff inset}
.knopf.gewaehlt .haken{visibility:visible}
.knopf:active{transform:translateY(1px)}
.knopf:focus-visible{outline:3px solid #f0b400;outline-offset:2px}
.status{margin-top:14px;padding:12px;border-radius:12px;background:#eef2f6;font-size:.98rem}
.status.ok{background:#e6f4ec;color:var(--ok)}
.status.warn{background:#fbf3df;color:var(--warn)}
.klein{color:var(--gedaempft);font-size:.88rem}
.runden{display:grid;gap:12px}
.runden button{min-height:var(--tap);border-radius:14px;border:1px solid var(--rand);
               background:#fff;font-weight:700;font-size:1.1rem}
.verborgen{display:none !important}
@media print{body{background:#fff}.wahl,.runden{display:none !important}}
</style>
</head>
<body>
<div class="huelle">
  <h1 id="titel"></h1>
  <p class="unter" id="untertitel"></p>
  <main id="buehne"></main>
  <p class="klein" id="fuss"></p>
</div>

<script>
/* ========================================================================
   1. INHALT – nur dieser Block wird angepasst.
   ======================================================================== */
const DATEN = {
  titel: "Bali-Wasserkonferenz 2035",
  untertitel: "Wem gehört das Wasser auf Bali?",
  antrag: "Ein Investor aus Jakarta will bei Tabanan auf heutigem Reisland ein neues Tourismusgebiet mit 500 Hotelzimmern, Pools und Restaurants bauen. Er verspricht Arbeitsplätze und Einnahmen.",
  antragHinweis: "Antrag an die Konferenz (erfunden)",
  runden: {
    vorher:  { name: "Runde 1", frage: "Wie entscheidest du über den Antrag?",
               hinweis: "Stell dich zusätzlich in das passende Feld im Raum." },
    nachher: { name: "Runde 2", frage: "Und jetzt, nach der Konferenz?",
               hinweis: "Geh in dein Feld im Raum. Gleich bleiben ist so legitim wie wechseln." }
  },
  wahl: [
    { w: "ja",   text: "Ja" },
    { w: "bed",  text: "Ja unter Bedingungen" },
    { w: "nein", text: "Nein" }
  ],
  fuss: "Anonym: Gespeichert wird nur deine Wahl, kein Name. Du kannst bis zum Schluss wechseln."
};

/* Firebase Realtime Database – Adresse aus der Firebase-Konsole */
const CONFIG = {
  datenbank: "https://DATENBANK-EINTRAGEN.europe-west1.firebasedatabase.app",
  projekt: "bali-wasser/oeffentlich",
  sitzungStandard: "seminar"
};

/* ========================================================================
   2. SPEICHER – localStorage, wenn vorhanden, sonst Arbeitsspeicher
   ======================================================================== */
const Speicher = (() => {
  let vorhanden = false, ersatz = {};
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); vorhanden = true; }
  catch (e) { vorhanden = false; }
  return {
    lies(k, standard) {
      try { const roh = vorhanden ? localStorage.getItem(k) : ersatz[k];
            return roh == null ? standard : JSON.parse(roh); }
      catch (e) { return standard; }
    },
    schreib(k, wert) {
      try { const roh = JSON.stringify(wert);
            if (vorhanden) localStorage.setItem(k, roh); else ersatz[k] = roh; }
      catch (e) {}
    }
  };
})();

/* ========================================================================
   3. SYNC – eine REST-Anbindung, kein SDK
   ======================================================================== */
const Sync = (() => {
  const url = (pfad) => `${CONFIG.datenbank.replace(/\/$/, "")}/${CONFIG.projekt}/${pfad}.json`;
  function geraeteId() {
    let id = Speicher.lies("geraeteId", null);
    if (!id || !/^[a-z0-9]{12,40}$/.test(id)) {
      const b = new Uint8Array(16); crypto.getRandomValues(b);
      id = [...b].map(x => x.toString(36).padStart(2, "0")).join("").slice(0, 24);
      Speicher.schreib("geraeteId", id);
    }
    return id;
  }
  async function schreib(pfad, wert) {
    try {
      const a = await fetch(url(pfad), { method: "PUT",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(wert) });
      return a.ok ? { ok: true } : { ok: false, status: a.status };
    } catch (e) { return { ok: false, status: 0 }; }
  }
  return { geraeteId, schreib };
})();

/* ========================================================================
   4. ABLAUF
   ======================================================================== */
const $ = (s) => document.querySelector(s);
const buehne = $("#buehne");
function el(tag, attr = {}, ...kinder) {
  const k = document.createElement(tag);
  for (const [n, w] of Object.entries(attr)) {
    if (n === "class") k.className = w;
    else if (n.startsWith("on")) k.addEventListener(n.slice(2), w);
    else if (w != null) k.setAttribute(n, w);
  }
  for (const c of kinder.flat()) if (c != null) k.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return k;
}

const parameter = new URLSearchParams(location.search);
const sitzung = (parameter.get("s") || CONFIG.sitzungStandard).toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 24) || CONFIG.sitzungStandard;
const rundeRoh = (parameter.get("r") || "").toLowerCase();
const runde = rundeRoh === "v" || rundeRoh === "vorher" ? "vorher"
            : rundeRoh === "n" || rundeRoh === "nachher" ? "nachher" : null;
const textZu = (w) => (DATEN.wahl.find(x => x.w === w) || {}).text || "";
const schluessel = (r) => `wahl_${sitzung}_${r}`;

let wartend = null;      // letzte Wahl, die noch nicht angekommen ist

function antragKarte() {
  return el("div", { class: "karte antrag" },
    el("b", {}, DATEN.antragHinweis), DATEN.antrag);
}

function rundenWahl() {
  buehne.replaceChildren(antragKarte(), el("div", { class: "karte" },
    el("p", { class: "frage" }, "Welche Runde?"),
    el("div", { class: "runden" },
      el("button", { onclick: () => location.search = `?r=v${sitzung !== CONFIG.sitzungStandard ? "&s=" + sitzung : ""}` }, "Runde 1: vorher"),
      el("button", { onclick: () => location.search = `?r=n${sitzung !== CONFIG.sitzungStandard ? "&s=" + sitzung : ""}` }, "Runde 2: nachher"))));
}

function abstimmung() {
  const R = DATEN.runden[runde];
  const gewaehlt = Speicher.lies(schluessel(runde), null);
  const status = el("div", { class: "status verborgen", role: "status", "aria-live": "polite" });
  const knoepfe = DATEN.wahl.map(o => el("button", {
      class: "knopf" + (gewaehlt === o.w ? " gewaehlt" : ""), "data-w": o.w,
      "aria-pressed": gewaehlt === o.w ? "true" : "false",
      onclick: () => waehlen(o.w, knoepfe, status) },
    el("span", {}, o.text), el("span", { class: "haken", "aria-hidden": "true" }, "✓")));

  const vorherWahl = runde === "nachher" ? Speicher.lies(schluessel("vorher"), null) : null;

  buehne.replaceChildren(
    antragKarte(),
    el("div", { class: "karte" },
      el("p", { class: "klein" }, R.name),
      el("p", { class: "frage" }, R.frage),
      vorherWahl ? el("p", { class: "klein" }, `In Runde 1 hast du «${textZu(vorherWahl)}» gewählt.`) : null,
      el("div", { class: "wahl" }, knoepfe),
      status,
      el("p", { class: "klein", style: "margin-top:12px" }, R.hinweis)));

  if (gewaehlt) zeigeStatus(status, "ok", `Gezählt: «${textZu(gewaehlt)}». Du kannst noch wechseln.`);
}

function zeigeStatus(status, art, text) {
  status.className = "status " + art;
  status.textContent = text;
}

async function waehlen(w, knoepfe, status) {
  knoepfe.forEach(k => {
    const an = k.dataset.w === w;
    k.classList.toggle("gewaehlt", an);
    k.setAttribute("aria-pressed", an ? "true" : "false");
  });
  Speicher.schreib(schluessel(runde), w);
  zeigeStatus(status, "", "Wird gesendet …");
  wartend = w;
  await senden(status);
}

async function senden(status) {
  if (!wartend) return;
  const w = wartend;
  const r = await Sync.schreib(`${sitzung}/${runde}/${Sync.geraeteId()}`,
                               { w, t: { ".sv": "timestamp" } });
  if (w !== wartend) return;                 // inzwischen neu gewählt
  if (r.ok) {
    wartend = null;
    zeigeStatus(status, "ok", `Gezählt: «${textZu(w)}». Du kannst noch wechseln.`);
  } else if (r.status === 0) {
    zeigeStatus(status, "warn", "Keine Verbindung. Deine Wahl wird gesendet, sobald das Netz wieder da ist. Stell dich einfach ins Feld im Raum.");
    setTimeout(() => senden(status), 4000);
  } else {
    wartend = null;
    zeigeStatus(status, "warn", "Das hat nicht geklappt. Stell dich einfach ins Feld im Raum.");
  }
}

/* ========================================================================
   5. START
   ======================================================================== */
$("#titel").textContent = DATEN.titel;
$("#untertitel").textContent = DATEN.untertitel;
$("#fuss").textContent = DATEN.fuss;
document.title = DATEN.titel;
if (runde) abstimmung(); else rundenWahl();
</script>
</body>
</html>
